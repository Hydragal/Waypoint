# Tells the website that a release was published, so its release watcher checks it within minutes rather than at its daily look.
# It sends no payload: the website reads the latest release itself and checks it in full. It runs only when a release is published,
# which only the repository's owner can do, never on anything a fork can start, and its own token is given no permission. The secret
# WEBSITE_DISPATCH_TOKEN is the owner's (a fine-grained token for the website repository alone, Contents read and write); without it
# the step fails and nothing else happens. shelfcheck holds all of this.
name: Tell the website

on:
  release:
    types: [published]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the website's release watcher
        env:
          TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ImmuneMoon/Waypoint-Website/dispatches \
            -d '{"event_type":"waypoint-release"}'
